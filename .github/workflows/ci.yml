name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        workspace: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ${{ matrix.workspace }}/package-lock.json
      - working-directory: ${{ matrix.workspace }}
        run: npm ci
      - working-directory: ${{ matrix.workspace }}
        run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        workspace: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ${{ matrix.workspace }}/package-lock.json
      - working-directory: ${{ matrix.workspace }}
        run: npm ci
      # El backend importa tipos generados por Prisma (@prisma/client) —
      # sin este paso, tsc falla con "no exported member 'User'" aunque el
      # código esté bien. No necesita una base de datos real, solo el
      # schema para generar los tipos.
      - name: Generate Prisma Client (solo backend)
        if: matrix.workspace == 'backend'
        working-directory: backend
        run: npx prisma generate
      - working-directory: ${{ matrix.workspace }}
        run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ruleta_pozo_acumulado_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    strategy:
      matrix:
        workspace: [backend, frontend]
    env:
      # Solo lo usa el workspace backend (tests de integración, ver
      # tests/integration/helpers.ts); se declara a nivel de job por
      # simplicidad, no tiene efecto en frontend.
      DATABASE_URL: postgresql://test:test@localhost:5432/ruleta_pozo_acumulado_test
      NODE_ENV: test
      JWT_SECRET: ci-test-jwt-secret-not-for-production
      REFRESH_TOKEN_PEPPER: ci-test-refresh-pepper-not-for-production
      EMAIL_TOKEN_PEPPER: ci-test-email-pepper-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ${{ matrix.workspace }}/package-lock.json
      - working-directory: ${{ matrix.workspace }}
        run: npm ci
      - name: Generate Prisma Client y aplicar migraciones (solo backend)
        if: matrix.workspace == 'backend'
        working-directory: backend
        run: |
          npx prisma generate
          npx prisma migrate deploy
      - working-directory: ${{ matrix.workspace }}
        run: npm test
