services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-ruleta_pozo_acumulado}
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
    restart: unless-stopped
    # Solo las variables que el backend realmente usa en V0.2 (ver
    # src/config/game-rules.ts y src/app.ts). Nada de secretos de BD/JWT/
    # email: ese código no existe todavía (V0.3+). Se pasan explícitas en
    # vez de env_file: .env para no propagar secretos que este servicio no
    # necesita (resuelve A15).
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-3000}
      POT_MINIMUM: ${POT_MINIMUM:-100}
      CONTRIBUTION_AMOUNT: ${CONTRIBUTION_AMOUNT:-1}
      GOLD_PROBABILITY_DENOMINATOR: ${GOLD_PROBABILITY_DENOMINATOR:-100000}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - /app/backend/node_modules

  frontend:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.frontend
    restart: unless-stopped
    # El frontend no necesita ninguna variable de entorno en V0.2 (no lee
    # secretos de BD/JWT/email; resuelve A15).
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
